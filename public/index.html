<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b5d8a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>SafeChat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <h1>SafeChat</h1>
    <p>הכנס קוד</p>
    <form id="loginForm">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus>
      <button type="submit">כניסה</button>
    </form>
    <div id="loginError" class="error"></div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="topbar">
        <h2>צ'אטים</h2>
        <button id="logoutBtn" title="יציאה">⎋</button>
      </div>
      <div id="chatList" class="chat-list"></div>
    </aside>
    <main class="conversation">
      <div id="placeholder" class="placeholder">בחר צ'אט כדי להתחיל</div>
      <div id="chatView" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
        <div class="topbar">
          <button class="back" id="backBtn">→</button>
          <div class="avatar" id="chatAvatar"></div>
          <h2 id="chatTitle"></h2>
        </div>
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <input id="msgInput" placeholder="הקלד הודעה" autocomplete="off">
          <button type="submit" title="שלח">➤</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="common.js"></script>
  <script src="chat.js"></script>
</body>
</html>
